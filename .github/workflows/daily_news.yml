name: 每日科技前沿早报推送

on:
  schedule:
    # 每天 UTC 23:00 = 北京时间 07:00
    - cron: '0 23 * * *'
  workflow_dispatch: # 允许手动触发测试

# 需要写权限，才能把每日知识库（档案 + 索引）提交回仓库
permissions:
  contents: write

jobs:
  send-daily-news:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行推送脚本
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}        # DeepSeek Key
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}                # Semantic Scholar Key（建议配置）
          # ↓ 第二阶段（飞书多维表格同步）；未配置则自动跳过
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BITABLE_APP_TOKEN: ${{ secrets.FEISHU_BITABLE_APP_TOKEN }}
          FEISHU_BITABLE_TABLE_ID: ${{ secrets.FEISHU_BITABLE_TABLE_ID }}
        run: python feishu_news_bot.py

      - name: 提交知识库更新
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add knowledge_base/ || true
          if git diff --cached --quiet; then
            echo "知识库无变化，跳过提交。"
          else
            git commit -m "chore: 更新知识库档案 $(date -u +%Y-%m-%d)"
            git push
          fi
